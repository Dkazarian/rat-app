:root[data-theme=&quot;light&quot;] {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;style&gt;
    #expense-buckets-mock {
      --eb-canvas: light-dark(#f3eff8, #18161e);
      --eb-surface: light-dark(#fffdfb, #26222d);
      --eb-surface-soft: light-dark(#f7f2f8, #302a37);
      --eb-text: light-dark(#28232d, #f7f2fa);
      --eb-muted: light-dark(#736b78, #bbb1c1);
      --eb-line: light-dark(#ded6e2, #49404f);
      --eb-ink: light-dark(#413949, #efe7f2);
      --eb-coral: light-dark(#ff756f, #ff8b85);
      --eb-coral-soft: light-dark(#ffe6e2, #522e32);
      --eb-purple: light-dark(#7665a8, #a995e2);
      --eb-teal: light-dark(#4c9b8d, #72c7b6);
      --eb-yellow: light-dark(#d9a93c, #efc76a);
      --eb-blue: light-dark(#5d88bd, #86afe0);
      color-scheme: light dark;
      color: var(--eb-text);
      font-family: &quot;Segoe UI&quot;, system-ui, sans-serif;
      width: 100%;
    }
    #expense-buckets-mock * { box-sizing: border-box; }
    #expense-buckets-mock button,
    #expense-buckets-mock textarea { font: inherit; }
    #expense-buckets-mock .eb-app {
      background: var(--eb-canvas);
      border: 1px solid var(--eb-line);
      border-radius: 24px;
      overflow: hidden;
      min-width: 0;
    }
    #expense-buckets-mock .eb-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      background: var(--eb-surface);
      border-bottom: 1px solid var(--eb-line);
    }
    #expense-buckets-mock .eb-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    #expense-buckets-mock .eb-brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--eb-coral-soft);
      overflow: hidden;
      flex: 0 0 auto;
    }
    #expense-buckets-mock .eb-brand-mark img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      transform: translateY(4px);
    }
    #expense-buckets-mock .eb-brand-copy { min-width: 0; }
    #expense-buckets-mock .eb-brand-name {
      margin: 0;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    #expense-buckets-mock .eb-brand-tagline {
      margin: 1px 0 0;
      color: var(--eb-muted);
    }
    #expense-buckets-mock .eb-language {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 3px;
      border: 1px solid var(--eb-line);
      border-radius: 999px;
      background: var(--eb-surface-soft);
      flex: 0 0 auto;
    }
    #expense-buckets-mock .eb-language button {
      min-width: 42px;
      border: 0;
      border-radius: 999px;
      padding: 7px 10px;
      background: transparent;
      color: var(--eb-muted);
      cursor: pointer;
    }
    #expense-buckets-mock .eb-language button[aria-pressed=&quot;true&quot;] {
      background: var(--eb-ink);
      color: var(--eb-surface);
    }
    #expense-buckets-mock .eb-main { padding: 22px; }
    #expense-buckets-mock .eb-capture {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
      padding: 18px;
      background: var(--eb-surface);
      border: 1px solid var(--eb-line);
      border-radius: 20px;
    }
    #expense-buckets-mock .eb-composer {
      min-width: 0;
      grid-column: 2;
      grid-row: 1;
    }
    #expense-buckets-mock .eb-label {
      display: block;
      margin-bottom: 9px;
      font-weight: 500;
    }
    #expense-buckets-mock .eb-input-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }
    #expense-buckets-mock textarea {
      min-width: 0;
      min-height: 82px;
      flex: 1;
      resize: vertical;
      border: 1px solid var(--eb-line);
      border-radius: 14px;
      padding: 13px 14px;
      background: var(--eb-surface-soft);
      color: var(--eb-text);
    }
    #expense-buckets-mock textarea::placeholder { color: var(--eb-muted); }
    #expense-buckets-mock .eb-add {
      align-self: stretch;
      min-width: 96px;
      border: 0;
      border-radius: 14px;
      padding: 0 16px;
      background: var(--eb-ink);
      color: var(--eb-surface);
      cursor: pointer;
      font-weight: 500;
    }
    #expense-buckets-mock .eb-feedback {
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      align-items: end;
      gap: 8px;
      min-height: 112px;
      grid-column: 1;
      grid-row: 1;
    }
    #expense-buckets-mock .eb-mascot {
      width: 116px;
      height: 116px;
      object-fit: contain;
      align-self: end;
    }
    #expense-buckets-mock .eb-bubble {
      position: relative;
      align-self: start;
      background: var(--eb-surface);
      border: 1px solid var(--eb-line);
      border-radius: 18px 18px 18px 5px;
      padding: 13px 14px;
      min-width: 0;
    }
    #expense-buckets-mock .eb-bubble::after {
      content: &quot;&quot;;
      position: absolute;
      left: -9px;
      bottom: 10px;
      width: 16px;
      height: 16px;
      background: var(--eb-surface);
      border-left: 1px solid var(--eb-line);
      border-bottom: 1px solid var(--eb-line);
      transform: rotate(45deg);
    }
    #expense-buckets-mock .eb-bubble-title {
      position: relative;
      z-index: 1;
      margin: 0 0 3px;
      font-weight: 500;
    }
    #expense-buckets-mock .eb-bubble-copy {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--eb-muted);
    }
    #expense-buckets-mock .eb-workspace {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
    }
    #expense-buckets-mock .eb-panel {
      background: var(--eb-surface);
      border: 1px solid var(--eb-line);
      border-radius: 20px;
      padding: 17px;
      min-width: 0;
    }
    #expense-buckets-mock .eb-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }
    #expense-buckets-mock .eb-panel-title {
      margin: 0;
      font-weight: 500;
    }
    #expense-buckets-mock .eb-new-category {
      border: 1px solid var(--eb-line);
      border-radius: 10px;
      padding: 7px 9px;
      background: var(--eb-surface-soft);
      color: var(--eb-text);
      cursor: pointer;
    }
    #expense-buckets-mock .eb-category-list,
    #expense-buckets-mock .eb-expense-list {
      display: grid;
      gap: 8px;
    }
    #expense-buckets-mock .eb-category {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 10px 0;
      border-bottom: 1px solid var(--eb-line);
    }
    #expense-buckets-mock .eb-category:last-child { border-bottom: 0; }
    #expense-buckets-mock .eb-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--eb-dot);
    }
    #expense-buckets-mock .eb-category-name { min-width: 0; }
    #expense-buckets-mock .eb-value {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      font-weight: 500;
    }
    #expense-buckets-mock .eb-content {
      display: grid;
      gap: 18px;
      min-width: 0;
      padding: 18px;
      background: var(--eb-surface);
      border: 1px solid var(--eb-line);
      border-radius: 20px;
    }
    #expense-buckets-mock .eb-content &gt; .eb-panel {
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
    }
    #expense-buckets-mock .eb-content &gt; .eb-panel + .eb-panel {
      padding-top: 18px;
      border-top: 1px solid var(--eb-line);
    }
    #expense-buckets-mock .eb-overview {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      gap: 18px;
      align-items: center;
    }
    #expense-buckets-mock .eb-chart-wrap {
      display: grid;
      place-items: center;
      min-height: 170px;
    }
    #expense-buckets-mock .eb-chart {
      display: grid;
      place-items: center;
      width: 156px;
      height: 156px;
      border-radius: 50%;
      background: conic-gradient(var(--eb-coral) 0 40%, var(--eb-purple) 40% 66%, var(--eb-teal) 66% 86%, var(--eb-yellow) 86% 100%);
    }
    #expense-buckets-mock .eb-chart-center {
      display: grid;
      place-items: center;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: var(--eb-surface);
      text-align: center;
    }
    #expense-buckets-mock .eb-chart-total {
      display: block;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    #expense-buckets-mock .eb-chart-caption {
      color: var(--eb-muted);
    }
    #expense-buckets-mock .eb-breakdown {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
    }
    #expense-buckets-mock .eb-breakdown-item {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }
    #expense-buckets-mock .eb-breakdown-item span:last-child {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    #expense-buckets-mock .eb-expense {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid var(--eb-line);
    }
    #expense-buckets-mock .eb-expense:last-child { border-bottom: 0; }
    #expense-buckets-mock .eb-expense-copy { min-width: 0; }
    #expense-buckets-mock .eb-expense-name { margin: 0; }
    #expense-buckets-mock .eb-expense-meta {
      margin: 2px 0 0;
      color: var(--eb-muted);
    }
    #expense-buckets-mock .eb-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 14px;
      margin-top: 10px;
      padding: 7px 22px;
      background: transparent;
      color: var(--eb-muted);
      font-size: 0.88em;
      text-align: center;
    }
    #expense-buckets-mock .eb-footer a {
      color: var(--eb-purple);
      font-weight: 500;
    }
    #expense-buckets-mock .eb-footer-model {
      color: var(--eb-text);
    }
    @media (max-width: 680px) {
      #expense-buckets-mock .eb-topbar,
      #expense-buckets-mock .eb-main { padding: 15px; }
      #expense-buckets-mock .eb-brand-tagline { display: none; }
      #expense-buckets-mock .eb-capture,
      #expense-buckets-mock .eb-workspace,
      #expense-buckets-mock .eb-overview { grid-template-columns: 1fr; }
      #expense-buckets-mock .eb-capture { align-items: stretch; padding: 18px; }
      #expense-buckets-mock .eb-composer { grid-column: 1; grid-row: 2; }
      #expense-buckets-mock .eb-feedback {
        grid-template-columns: 82px minmax(0, 1fr);
        min-height: 0;
        grid-column: 1;
        grid-row: 1;
      }
      #expense-buckets-mock .eb-mascot { width: 88px; height: 88px; }
      #expense-buckets-mock .eb-input-row { flex-direction: column; }
      #expense-buckets-mock .eb-add { min-height: 46px; }
      #expense-buckets-mock .eb-overview { gap: 8px; }
      #expense-buckets-mock .eb-breakdown { grid-template-columns: 1fr; }
    }

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
